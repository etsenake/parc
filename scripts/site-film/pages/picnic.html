<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html{padding:0!important;margin:0!important}
*{box-sizing:border-box;margin:0}
body{background:#FBF4EA;color:#2B2320;font:17px/1.55 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;font-weight:700}
.top b{font:italic 700 24px Georgia,serif;color:#C4502E}
.top span{font-size:14px;color:#8A7C72}
.card{margin:6px 40px 40px;padding:36px 40px;border-radius:18px;background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(120,80,40,.08)}
.tag{display:inline-block;padding:5px 12px;border-radius:999px;background:#FBE4D9;color:#C4502E;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{margin-top:14px;font:700 40px/1.1 Georgia,serif;letter-spacing:-.01em}
.row{display:flex;gap:22px;margin-top:18px;font-size:14px;color:#8A7C72}
.photo{height:220px;margin-top:26px;border-radius:14px;background:radial-gradient(circle at 30% 40%,#F2C26B 0 46px,transparent 47px),radial-gradient(circle at 62% 58%,#E86A5A 0 38px,transparent 39px),radial-gradient(circle at 78% 34%,#7DB36B 0 30px,transparent 31px),repeating-linear-gradient(45deg,#F7E3C8 0 18px,#F1D6B2 18px 36px)}
h2{margin-top:30px;font:700 22px Georgia,serif}
ul{margin-top:12px;padding-left:0;list-style:none}
li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1E8DD}
li i{width:20px;height:20px;border-radius:6px;border:2px solid #C4502E}
li.done i{background:#C4502E}
li.done span{text-decoration:line-through;color:#A89A90}
</style>
</head>
<body>
<header class="top"><b>Sunday Table</b><span>Recipes · Plans · Lists</span></header>
<div class="card">
<span class="tag">Weekend plan</span>
<h1>The perfect park picnic</h1>
<div class="row"><span>Serves 4</span><span>20 min prep</span><span>No cooking</span></div>
<div class="photo"></div>
<h2>Pack the basket</h2>
<ul>
<li class="done"><i></i><span>Blanket and two cushions</span></li>
<li class="done"><i></i><span>Sourdough loaf, sliced</span></li>
<li><i></i><span>Peaches, figs and a wedge of comté</span></li>
<li><i></i><span>Lemonade in a thermos</span></li>
<li><i></i><span>The kite (obviously)</span></li>
</ul>
</div>
</body>
</html>
