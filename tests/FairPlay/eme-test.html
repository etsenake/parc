<!doctype html>
<!-- Test page for the first engine build with FairPlay. Serve it from localhost and open it in Parc:
     python3 -m http.server -d tests/FairPlay --bind 127.0.0.1 18791   then   http://127.0.0.1:18791/eme-test.html
     Verified 2026-11-06 in system WebKit (Safari 27.2 identity): all three vectors license and play with 0 dropped frames.
     WebKit reports sinf init data; Chromium reports cenc from the init segment pssh boxes. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairPlay EME Test</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --ok: #1a7f37; --bad: #c62828; --line: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --ok: #3fb950; --bad: #ff6b6b; --line: #3a3a3c; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px -apple-system, system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, button { font: inherit; padding: 4px 10px; }
  video { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; display: block; }
  #checks { list-style: none; padding: 0; margin: 12px 0; }
  #checks li { padding: 2px 0; }
  #checks li.ok::before { content: "✓ "; color: var(--ok); }
  #checks li.bad::before { content: "✗ "; color: var(--bad); }
  #checks li.wait::before { content: "… "; color: var(--muted); }
  pre { border-top: 1px solid var(--line); padding-top: 8px; font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto; }
</style>
<h1>FairPlay EME Test</h1>
<p>Plays Axinom's public FairPlay CMAF vectors through MSE and standard EME (com.apple.fps), the path Netflix and Apple TV+ take. The picture may stay black in screenshots; that is expected for protected video, so judge playback by the clock and the checks.</p>
<div class="bar">
  <select id="vector">
    <option value="single">H.264, one key (cbcs)</option>
    <option value="multi">H.264, three keys in one request (Netflix's shape)</option>
    <option value="hevc">HEVC, one key (cbcs)</option>
  </select>
  <select id="keysystem">
    <option>com.apple.fps</option>
    <option>com.apple.fps.3_0</option>
  </select>
  <button id="start">Play</button>
  <button id="pip">Picture in Picture</button>
  <button id="fs">Full screen</button>
  <button id="seek">Seek to 40 s</button>
</div>
<video id="video" controls playsinline></video>
<ul id="checks"></ul>
<pre id="log"></pre>

const VECTORS = {
  single: { base: "https://media.axprod.net/TestVectors/Cmaf/protected_1080p_h264_cbcs/",
            video: "video-H264-720-2100k.m3u8", vcodec: "avc1.64001f", token: TOKEN_SINGLE },
  multi:  { base: "https://media.axprod.net/TestVectors/MultiKey/Cmaf_h264_1080p_cbcs/",
            video: "video-H264-720-2100k.m3u8", vcodec: "avc1.64001f", token: TOKEN_MULTI },
  hevc:   { base: "https://media.axprod.net/TestVectors/H265/protected_cmaf_1080p_h265_singlekey/",
            video: "video-H265-720-2100k.m3u8", vcodec: "hvc1.1.6.L93.90", token: TOKEN_HEVC },
};
const ACODEC = "mp4a.40.2";
const SEGMENTS = 14;  // about 84 s of each stream

const $ = (id) => document.getElementById(id);
const video = $("video");
const t0 = performance.now();
const log = (...a) => { $("log").textContent += `[${((performance.now() - t0) / 1000).toFixed(2)}] ${a.join(" ")}\n`; };
const checks = new Map();
function check(name, state, detail = "") {
  let li = checks.get(name);
  if (!li) { li = document.createElement("li"); $("checks").append(li); checks.set(name, li); }
  li.className = state;
  li.textContent = detail ? `${name}: ${detail}` : name;
}
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");

async function get(url, start, length) {
  const headers = length ? { Range: `bytes=${start}-${start + length - 1}` } : {};
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error(`${url} HTTP ${r.status}`);
  return r.arrayBuffer();
}

// HLS media playlist over CMAF byte ranges: EXT-X-MAP init plus EXTINF/EXT-X-BYTERANGE segments.
async function loadPlaylist(base, name) {
  const text = await (await fetch(base + name)).text();
  let init = null, next = 0, range = null;
  const segments = [];
  for (const line of text.split("\n").map((l) => l.trim())) {
    if (line.startsWith("#EXT-X-MAP:")) {
      const uri = /URI="([^"]+)"/.exec(line)[1];
      const [len, off] = /BYTERANGE="(\d+)@(\d+)"/.exec(line).slice(1).map(Number);
      init = { url: base + uri, start: off, length: len };
    } else if (line.startsWith("#EXT-X-BYTERANGE:")) {
      const [len, off] = line.slice(17).split("@");
      range = { start: off !== undefined ? Number(off) : next, length: Number(len) };
      next = range.start + range.length;
    } else if (line && !line.startsWith("#")) {
      segments.push({ url: base + line, ...range });
    }
  }
  return { init, segments };
}

function appendBuffer(sb, data) {
  return new Promise((resolve, reject) => {
    sb.addEventListener("updateend", resolve, { once: true });
    sb.addEventListener("error", () => reject(new Error("appendBuffer error")), { once: true });
    sb.appendBuffer(data);
  });
}

async function feed(sb, playlist, label) {
  await appendBuffer(sb, await get(playlist.init.url, playlist.init.start, playlist.init.length));
  log(`${label}: init segment appended`);
  for (const [i, s] of playlist.segments.slice(0, SEGMENTS).entries()) {
    await appendBuffer(sb, await get(s.url, s.start, s.length));
    if (i === 0) log(`${label}: first media segment appended`);
  }
  log(`${label}: ${Math.min(SEGMENTS, playlist.segments.length)} segments appended`);
}

// Standard FairPlay EME message handling, as Safari exposes it: cenc/keyids sessions send a JSON
// array of {keyID, payload: SPC}; the license server takes each raw SPC and returns the raw CKC;
// the page answers with a JSON array of {keyID, payload: CKC}. skd/sinf sessions send the raw SPC.
async function postSpc(spc, token) {
  const r = await fetch(LICENSE_URL, { method: "POST", body: spc,
    headers: { "Content-Type": "application/octet-stream", "X-AxDRM-Message": token } });
  if (!r.ok) throw new Error(`license HTTP ${r.status} ${r.headers.get("X-AxDRM-ErrorMessage") || ""}`);
  return r.arrayBuffer();
}

async function onMessage(session, event, token) {
  const bytes = new Uint8Array(event.message);
  let entries = null;
  try { entries = JSON.parse(new TextDecoder().decode(bytes)); } catch { /* raw SPC */ }
  check("License message", "ok", `${event.messageType}, ${bytes.length} bytes${Array.isArray(entries) ? `, ${entries.length} SPC(s)` : ", raw SPC"}`);
  try {
    if (Array.isArray(entries)) {
      const out = [];
      for (const e of entries) {
        const ckc = await postSpc(unb64(e.payload), token);
        log(`CKC for key ${hex(unb64(e.keyID))}: ${ckc.byteLength} bytes`);
        out.push({ keyID: e.keyID, payload: b64(ckc) });
      }
      await session.update(new TextEncoder().encode(JSON.stringify(out)));
    } else {
      const ckc = await postSpc(bytes, token);
      log(`CKC: ${ckc.byteLength} bytes`);
      await session.update(ckc);
    }
    check("License server answered", "ok");
  } catch (e) {
    check("License server answered", "bad", e.message);
    log("license failed:", e.message);
  }
}

async function run() {
  $("start").disabled = true;
  const vec = VECTORS[$("vector").value];
  const keySystem = $("keysystem").value;
  const vtype = `video/mp4; codecs="${vec.vcodec}"`, atype = `audio/mp4; codecs="${ACODEC}"`;
  log(`vector ${$("vector").value}, key system ${keySystem}`);
  log(`user agent: ${navigator.userAgent}`);

  check("MSE supports the codecs", MediaSource.isTypeSupported(vtype) && MediaSource.isTypeSupported(atype) ? "ok" : "bad", `${vec.vcodec}, ${ACODEC}`);

  let access;
  try {
    access = await navigator.requestMediaKeySystemAccess(keySystem, [{
      initDataTypes: ["cenc", "keyids"],
      videoCapabilities: [{ contentType: vtype }],
      audioCapabilities: [{ contentType: atype }],
    }]);
    check(`requestMediaKeySystemAccess(${keySystem})`, "ok", access.keySystem);
  } catch (e) {
    check(`requestMediaKeySystemAccess(${keySystem})`, "bad", `${e.name}: ${e.message}`);
    return;
  }
  const mediaKeys = await access.createMediaKeys();
  try {
    const cert = await get(CERT_URL);
    await mediaKeys.setServerCertificate(cert);
    check("Server certificate accepted", "ok", `${cert.byteLength} bytes`);
  } catch (e) {
    check("Server certificate accepted", "bad", `${e.name}: ${e.message}`);
    return;
  }
  await video.setMediaKeys(mediaKeys);
  check("setMediaKeys", "ok");

  const seen = new Set();
  const sessions = [];
  const keyStatuses = new Map();
  let lastStatuses = "";
  const startSession = async (initDataType, initData, why) => {
    const key = initDataType + hex(initData);
    if (seen.has(key)) return;
    seen.add(key);
    const session = mediaKeys.createSession();
    sessions.push(session);
    session.addEventListener("message", (ev) => onMessage(session, ev, vec.token));
    session.addEventListener("keystatuseschange", () => {
      session.keyStatuses.forEach((status, id) => keyStatuses.set(hex(id), status));
      const st = [...keyStatuses].map(([id, status]) => `${id} ${status}`).join(", ");
      if (st === lastStatuses) return;
      lastStatuses = st;
      log("key statuses:", st);
      const usable = [...keyStatuses.values()].filter((s) => s === "usable").length;
      check("Keys usable", usable ? "ok" : "bad", `${usable} of ${keyStatuses.size}: ${st}`);
    });
    try {
      await session.generateRequest(initDataType, initData);
      log(`generateRequest(${initDataType}, ${initData.byteLength} bytes) from ${why}`);
    } catch (e) {
      check("generateRequest", "bad", `${initDataType}: ${e.name}: ${e.message}`);
    }
  };
  video.addEventListener("encrypted", (ev) => {
    check("encrypted event from the demuxer", "ok", `${ev.initDataType}, ${ev.initData.byteLength} bytes`);
    startSession(ev.initDataType, ev.initData, "encrypted event");
  });
  video.addEventListener("waitingforkey", () => log("waitingforkey"));

  const ms = new MediaSource();
  video.src = URL.createObjectURL(ms);
  await new Promise((r) => ms.addEventListener("sourceopen", r, { once: true }));
  const vsb = ms.addSourceBuffer(vtype), asb = ms.addSourceBuffer(atype);
  const [vpl, apl] = await Promise.all([loadPlaylist(vec.base, vec.video), loadPlaylist(vec.base, "audio-en.m3u8")]);
  check("Playlists loaded", "ok", `${vpl.segments.length} video, ${apl.segments.length} audio segments`);

  const fed = Promise.all([feed(vsb, vpl, "video"), feed(asb, apl, "audio")]);
  // If the demuxer never fires 'encrypted' (no pssh in the init segment), request the key by ID.
  setTimeout(() => {
    if (seen.size) return;
    check("encrypted event from the demuxer", "bad", "none after 4 s; requesting by key ID instead");
    const kid = /KEYID=0x([0-9A-F]{32})/i;
    fetch(vec.base + vec.video).then((r) => r.text()).then((t) => {
      const m = kid.exec(t);
      if (!m) return;
      const id = Uint8Array.from(m[1].match(/../g), (h) => parseInt(h, 16));
      const kids = JSON.stringify({ kids: [b64(id).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")] });
      startSession("keyids", new TextEncoder().encode(kids), "playlist KEYID");
    });
  }, 4000);

  check("Playback", "wait", "starting");
  video.muted = false;
  video.play().catch((e) => log("play() rejected:", e.name, e.message));
  let last = -1, advanced = 0;
  const tick = setInterval(() => {
    const t = video.currentTime;
    if (last >= 0 && t > last + 0.5) advanced += t - last;
    last = t;
    const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
    const frames = q ? `, ${q.totalVideoFrames} frames, ${q.droppedVideoFrames} dropped` : "";
    check("Playback", advanced > 5 ? "ok" : "wait",
      `t=${t.toFixed(1)} s, readyState ${video.readyState}, ${video.videoWidth}×${video.videoHeight}${frames}`);
  }, 1000);
  video.addEventListener("error", () => {
    clearInterval(tick);
    check("Playback", "bad", `media error ${video.error.code}: ${video.error.message}`);
  });
  await fed;
  ms.endOfStream();
  log("all media appended; end of stream signalled");
}

$("start").addEventListener("click", () => run().catch((e) => { log("failed:", e.stack || e); check("Run", "bad", e.message); }));
$("pip").addEventListener("click", () => video.requestPictureInPicture().catch((e) => log("PiP:", e.name, e.message)));
$("fs").addEventListener("click", () => video.requestFullscreen().catch((e) => log("fullscreen:", e.name, e.message)));
$("seek").addEventListener("click", () => { video.currentTime = 40; log("seek to 40 s"); });
video.addEventListener("enterpictureinpicture", () => log("entered Picture in Picture"));
video.addEventListener("leavepictureinpicture", () => log("left Picture in Picture"));

// Context: what this page looks like to sites. Widevine availability is informational.
navigator.requestMediaKeySystemAccess("com.widevine.alpha", [{ initDataTypes: ["cenc"], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.42E01E"' }] }])
  .then(() => log("Widevine: available to this page"), (e) => log(`Widevine: ${e.name}`));
</script>
