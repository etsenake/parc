<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Parc navigation test</title>
<style>body{font:18px system-ui;max-width:640px;margin:80px auto;color:#242033;background:#faf9fe}button,a,input{font:inherit;margin:12px 12px 12px 0}button{padding:10px 16px}input{padding:8px}output{font-weight:700}</style>
<h1>Parc engine test</h1>
<p>This local fixture exercises the actual Chromium page inside Parc.</p>
<button id="increment">Increment counter</button><output id="count">0</output>
<p><label>Editable page text <input aria-label="Editable page text" value="Native Chromium input"></label></p>
<p><a href="second.html">Open the second page</a></p>
<p>Find marker: Polaris is visible.</p>
<p><button id="remember">Save profile counter</button>Stored: <output id="stored"></output></p>
<p><button id="alert">Show alert</button><output id="alert-answer">Not shown</output></p>
<p><button id="confirm">Show confirmation</button><output id="confirmation">Not answered</output></p>
<p><button id="prompt">Show prompt</button><output id="prompt-answer">Not answered</output></p>
<p><a download="parc-download-test.txt" href="data:text/plain,Parc%20download%20verified%0A">Download the test file</a></p>
<p><button id="protect">Enable leave-page confirmation</button><output id="protected">Disabled</output></p>
<script>
const count = document.querySelector('#count');
document.querySelector('#increment').onclick = () => { count.value = String(Number(count.value) + 1); };
const storageKey = 'parc-fixture-profile-counter';
const stored = document.querySelector('#stored');
stored.value = localStorage.getItem(storageKey) || '0';
document.querySelector('#remember').onclick = () => {
  stored.value = String(Number(stored.value) + 1);
  localStorage.setItem(storageKey, stored.value);
};
document.querySelector('#alert').onclick = () => {
  alert('Verify the native alert, then dismiss it.');
  document.querySelector('#alert-answer').value = 'Dismissed';
};
document.querySelector('#confirm').onclick = () => {
  document.querySelector('#confirmation').value = confirm('Confirm the native dialog works?') ? 'Accepted' : 'Cancelled';
};
document.querySelector('#prompt').onclick = () => {
  const result = prompt('Enter a test value', 'Parc');
  document.querySelector('#prompt-answer').value = result === null ? 'Cancelled' : result;
};
document.querySelector('#protect').onclick = () => {
  window.onbeforeunload = event => { event.preventDefault(); event.returnValue = ''; };
  document.querySelector('#protected').value = 'Enabled';
};
</script>
</html>
