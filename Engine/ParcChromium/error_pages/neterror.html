<!doctype html>
<html dir="$i18n{textdirection}" lang="$i18n{language}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFCEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141C" media="(prefers-color-scheme: dark)">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>{{style}}</style>
</head>
<body>
<main id="page" hidden>
<div id="art" class="art" aria-hidden="true"></div>
<h1 id="heading"></h1>
<p id="summary"></p>
<p id="status" hidden aria-live="polite"></p>
<div id="buttons">
<button id="primary" type="button" hidden><span class="label"></span><span class="chip" aria-hidden="true"><svg viewBox="0 0 12 10"><path d="M10.5 1v3.5H2 M4.5 1.5 1.5 4.5 4.5 7.5"/></svg></span></button>
<button id="secondary" type="button" hidden><span class="label"></span></button>
<button id="details-button" type="button" hidden aria-expanded="false"><span class="label"></span><svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1.5 1.25 5 4.75 8.5 1.25"/></svg></button>
</div>
<p id="hint" hidden></p>
<div id="details" hidden></div>
</main>
<div id="frame-error" hidden><div class="art" aria-hidden="true"></div><p></p></div>
<div id="code"></div>
{{art}}
<script>{{script}}</script>
</body>
</html>
